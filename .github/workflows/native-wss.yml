name: Native WSS transport

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-wss:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native transport build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libbsd-dev libcrypt-dev libncurses-dev libssl-dev libwslay-dev
      - name: Compile standalone RustyAxe
        run: make -j2 WITH_MONGOOSE=false
      - name: Exercise native transport and library tests
        run: make check WITH_MONGOOSE=false
